[project]
name = "esp32-docs-mcp"
version = "0.1.0"
description = "Local MCP server giving coding agents semantic search over ESP-IDF documentation and the ESP32 Technical Reference Manuals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ozonejunkieau" }]
requires-python = ">=3.12"
keywords = ["esp32", "esp-idf", "mcp", "model-context-protocol", "embeddings", "lancedb", "mlx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "docutils>=0.23",
    "hf>=1.24.0",
    "lancedb>=0.34.0",
    "mcp>=1.28.1",
    "mlx-embeddings>=0.1.0",
    "pydantic>=2.13.4",
    "pylatexenc>=2.10",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/ozonejunkieau/esp32-docs-mcp"
Repository = "https://github.com/ozonejunkieau/esp32-docs-mcp"
Issues = "https://github.com/ozonejunkieau/esp32-docs-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules under test live at the repo root (flat layout, no src/), so the
# rootdir has to be importable. `importmode=importlib` with rootdir on the path
# keeps that working without tests/__init__.py or a conftest sys.path hack.
pythonpath = ["."]
addopts = "-ra"
markers = [
    # Tests needing a local corpus that a fresh clone does not have: the ESP-IDF
    # Sphinx XML build ($IDF_PATH/docs/_build/en/<chip>/xml) or the TRM LaTeX
    # checkout ($TRM_PATH / ./trm_latex). They skip with an explicit reason when
    # the inputs are absent -- deselect with `-m 'not slow'` to skip them always.
    "slow: requires a locally built corpus; minutes, not seconds",
]
